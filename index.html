<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>Pont — conversations</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--fond:#0f1621;--carte:#18222f;--texte:#eef3fa;--second:#9fb0c3;--accent:#5eb8ff;--chaud:#f0a64b;--ligne:#ffffff1a}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:auto;padding:4px 14px 96px;width:100%;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 4px}h1{font-size:20px;margin:0;font-weight:600;overflow-wrap:anywhere}
h2{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--second);margin:18px 2px 8px;text-transform:none}
p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}small,.second{color:var(--second);font-size:13px}
section{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:12px 14px;margin:8px 0}
section.conv{border-color:color-mix(in srgb,var(--chaud) 55%,transparent)}
.meta{font-size:13px;color:var(--second);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.recap{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.question{font-weight:600;margin:8px 0}
button,select,textarea,input{font:inherit;color:var(--texte);border-radius:10px;border:1px solid var(--ligne);background:var(--carte)}
button{padding:9px 13px;min-height:42px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}button:active{transform:scale(.98)}
button.principal{background:var(--accent);border-color:transparent;color:#06121f;font-weight:600}
button.discret{background:transparent}button.danger{color:#ff9b96;background:transparent}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.puces button{min-height:36px;padding:6px 12px;font-size:14px;border-radius:18px}
.repondre{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.repondre textarea{flex:1;min-width:0;min-height:44px;max-height:160px;padding:10px 12px;resize:none;background:var(--fond)}
.repondre button{flex:none}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grille button{text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne{display:flex;gap:8px;flex-wrap:wrap}.ligne>*{flex:1}
.rangee{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.rangee+.rangee{border-top:1px solid var(--ligne)}
.calme{text-align:center;color:var(--second);padding:18px 10px}
textarea,select{display:block;width:100%;padding:10px 12px;margin:8px 0}select{background:var(--fond)}textarea{min-height:110px}
label{display:block;margin-top:14px;font-size:14px;color:var(--second)}
progress{display:block;width:100%;height:10px;accent-color:var(--accent);margin:6px 0 4px}
details{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;color:var(--second);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--fond);border-top:1px solid var(--ligne);padding:8px 10px max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center}
nav button{flex:1;min-width:0;font-size:13px;padding:8px 4px;background:transparent;border-color:transparent}
#fraicheur{position:sticky;top:0;z-index:10;background:var(--fond);padding:10px 14px 6px;font-size:13px;color:var(--second)}#envoi{padding:0 14px;font-size:14px}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.conversation-ligne{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:14px}.conversation-ligne small{display:block}.bulle{max-width:90%;border-radius:14px;padding:12px 16px;margin:12px 0;background:var(--carte);overflow-wrap:anywhere;white-space:pre-wrap}.bulle.toi{margin-left:auto;background:color-mix(in srgb,var(--accent) 22%,var(--carte))}.composeur{position:sticky;bottom:70px;background:var(--fond);padding:8px 0}.nouvelle-fixe{position:sticky;bottom:72px;width:100%;margin:16px 0 0}.quota-chaud{color:var(--chaud)}button,.puces button{min-height:44px}body{--ligne:color-mix(in srgb,var(--texte) 12%,transparent)}
</style></head><body><div id="fraicheur" role="status">🟡 Connexion au PC…</div><div id="envoi" role="status"></div><main id="app" aria-live="polite"><p class="calme">Chargement des conversations…</p></main><nav id="nav" aria-label="Navigation"></nav>
<script>
'use strict';
const tg=window.Telegram?.WebApp;let etat={projets:[],quotas:{},taches:[],reglages:{}},vue='accueil';
const app=document.querySelector('#app');
function el(tag,texte,classe){const e=document.createElement(tag);if(texte!==undefined)e.textContent=String(texte);if(classe)e.className=classe;return e}
function bouton(texte,action,classe){const b=el('button',texte,classe);b.type='button';b.onclick=action;return b}
function transmettre(a,champs={}){const data=JSON.stringify({v:1,a,...champs});if(new TextEncoder().encode(data).length>4096){alert('Ta consigne est trop longue. Raccourcis-la.');return}if(directPret){return envoyerDirect(JSON.parse(data))}if(typeof tg?.sendData!=='function'){alert('Ouvre cette appli depuis le bouton du bot Telegram.');return}tg.sendData(data);tg.close()}
function titre(texte,retour){app.replaceChildren();const h=el('header');const g=el('div');g.style.cssText='display:flex;align-items:center;gap:6px;min-width:0';if(retour){const r=bouton('‹',retour,'discret');r.setAttribute('aria-label','Retour');r.style.cssText='min-height:36px;padding:2px 10px;font-size:20px';g.append(r)}g.append(el('h1',texte));const a=bouton('↻',()=>envoyer('actualiser'),'discret');a.setAttribute('aria-label','Mettre à jour');h.append(g,a);app.append(h)}
function jauges(parent,agent,q){const box=el('section');box.append(el('div',agent==='claude'?'🤖 Claude':'🧩 Codex','meta'));const quand=t=>new Date(t*1000).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'});for(const [k,label] of [['five_hour','Session de 5 h'],['seven_day','Semaine']]){const f=q?.[k];const r=el('div');r.style.marginTop='10px';if(!f){r.append(el('p',label+' : '+(q&&k==='five_hour'?'pas de limite sur ton offre':'pas encore connue'),'second'));box.append(r);continue}const fini=f.resets_at*1000<Date.now();const pct=fini?0:Math.round(f.pct);r.append(el('p',label+' · '+pct+' %'));const pr=el('progress');pr.max=100;pr.value=pct;r.append(pr,el('small',fini?'Remis à zéro':'Repart à zéro '+quand(f.resets_at)));box.append(r)}if(q?.bloque_jusqu_a*1000>Date.now())box.append(el('p','⛔ Bloqué jusqu’à '+new Date(q.bloque_jusqu_a*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),'danger'));parent.append(box)}
function choixAgent(parent){const label=el('label','Avec quel agent ?');const select=el('select');for(const [v,t]of[['claude','🤖 Claude'],['codex','🧩 Codex'],['auto','✨ Auto — selon les quotas']]){const o=el('option',t);o.value=v;select.append(o)}select.value=etat.reglages?.agent_defaut||'auto';label.append(select);parent.append(label);return select}
function nouveau(nom){vue='nouveau';titre('🆕 Nouvelle tâche');const label=el('label','Projet');const projet=el('select');etat.projets.forEach(p=>{const o=el('option',p.nom);o.value=p.nom;o.selected=p.nom===nom;projet.append(o)});label.append(projet);app.append(label);const agent=choixAgent(app),texte=el('textarea');texte.placeholder='Ce que tu veux faire…';texte.maxLength=2000;texte.setAttribute('aria-label','Ta consigne');app.append(texte,bouton('Envoyer la consigne',()=>{if(texte.value.trim()&&projet.value)envoyer('nouveau',{projet:projet.value,agent:agent.value,texte:texte.value.trim()})},'principal'));app.append(el('p','Auto ménage l’agent le plus chargé. Tu confirmes le choix.','second'))}
function agents(){vue='agents';position={};titre('⚖️ Quotas',accueil);for(const a of ['claude','codex'])jauges(app,a,etat.quotas?.[a]);const b=bouton('🔄 Mettre à jour les quotas',()=>envoyer('actualiser'),'discret');b.style.width='100%';app.append(b)}
function court(s,n=60){s=String(s||'').replace(/\s*\n\s*[-*•]\s+/g,' · ').replace(/\s+/g,' ').replace(/^[-*• ]+/,'');return s.length>n?s.slice(0,n-1)+'…':s}
function pageListe(items,rendu,page=0,suite){items.slice(page*3,page*3+3).forEach(rendu);if(page)app.append(bouton('◀️ Retour',()=>suite(page-1)));if(items.length>(page+1)*3)app.append(bouton('Voir plus',()=>suite(page+1)))}
function quotasCourts(){const v=(q,k)=>{const f=q?.[k];return f?(f.resets_at*1000<Date.now()?0:Math.round(f.pct))+' %':'—'};return ['claude','codex'].map(a=>{const q=etat.quotas?.[a];return (a==='claude'?'Claude ':'Codex ')+(q?v(q,'five_hour')+' / '+v(q,'seven_day'):'?')}).join(' · ')+'  (5 h / sem.)'}
function depuis(ts){if(!ts)return '';const m=Math.floor((Date.now()/1000-ts)/60);return m<1?'à l’instant':m<60?'il y a '+m+' min':m<1440?'il y a '+Math.floor(m/60)+' h':'il y a '+Math.floor(m/1440)+' j'}
function attente(e){const question=e.type==='question';const s=el('section',undefined,'conv');const meta=el('div',undefined,'meta');meta.append(el('span',(e.agent==='codex'?'🧩 Codex':e.agent==='claude'?'🤖 Claude':'❓ Question')+' · '+e.projet));if(e.recu)meta.append(el('span','· '+depuis(e.recu)));s.append(meta);if(e.demande)s.append(el('p','🗣 Toi : « '+court(e.demande,110)+' »','second'));if(e.recap)s.append(el('p',e.recap,'recap'));(e.liens||[]).forEach(([t,u])=>{if(/^https:\/\//.test(u))s.append(bouton('🔗 '+court(t,40),()=>{if(typeof tg?.openLink==='function')tg.openLink(u);else window.open?.(u,'_blank','noopener')},'discret'))});if(e.texte)s.append(el('p',e.texte,'question'));if(e.images>0)s.append(bouton('🖼 Voir '+(e.images>1?'les '+e.images+' images':'l’image')+' dans la conversation',()=>{Promise.resolve(envoyer('images',{carte:e.id})).finally(()=>setTimeout(()=>tg?.close?.(),400))},'discret'));const choix=(question?e.options||[]:e.actions||[]).slice(0,4);if(choix.length){const pu=el('div',undefined,'puces');choix.forEach((a,i)=>pu.append(bouton(court(a,40),ev=>{if(pu.dataset.envoye)return;pu.dataset.envoye='1';(ev?.target||{}).textContent='✓ '+court(a,38);envoyer(question?'decision':'repondre',question?{question:e.id,option:i}:{carte:e.id,texte:a})})));s.append(pu)}const z=el('div',undefined,'repondre');const texte=el('textarea');texte.dataset.carte=e.id;texte.rows=1;texte.placeholder=choix.length?'Ou écris ta réponse…':'Ta réponse…';texte.maxLength=2000;texte.setAttribute('aria-label','Ta réponse');texte.oninput=()=>{texte.style.height='auto';texte.style.height=Math.min(160,texte.scrollHeight)+'px'};const env=bouton('Envoyer',()=>{const v=texte.value.trim();if(!v){texte.focus();return}if(env.disabled)return;env.disabled=true;env.textContent='Envoyé ✓';texte.value='';texte.disabled=true;envoyer(question?'decision_texte':'repondre',question?{question:e.id,texte:v}:{carte:e.id,texte:v})},'principal');z.append(texte,env);s.append(z);if(!question){const pl=el('div',undefined,'puces');pl.append(bouton('▶️ Continue',()=>envoyer('continuer',{carte:e.id}),'discret'),bouton('📄 Tout lire',()=>envoyer('tout_lire',{carte:e.id}),'discret'));s.append(pl)}return s}
function duree(debut){const e=el('span');e.dataset.debut=String(debut||Date.now()/1000);e.textContent=Math.max(0,Math.floor(Date.now()/1000-Number(e.dataset.debut)))+' s';return e}
function accueilV2(){vue='accueil';position={};titre('Pont');const boite=etat.boite||[];const convs=boite.filter(e=>e.type!=='etat');const afaire=boite.filter(e=>e.type==='etat');if(convs.length){app.append(el('h2','💬 À toi de répondre ('+convs.length+')'));convs.slice(0,3).forEach(e=>app.append(attente(e)));if(convs.length>3)app.append(bouton('Voir les '+(convs.length-3)+' autres',()=>reception(),'discret'))}else{const c=el('section',undefined,'calme');c.append(el('p','✅ Personne n’attend ta réponse'),el('small','Les nouvelles réponses de Claude et Codex apparaissent ici en direct.'));app.append(c)}if(etat.taches?.length){app.append(el('h2','🔵 En cours'));const t=el('section');etat.taches.slice(0,4).forEach(x=>{const r=el('div',undefined,'rangee');const g=el('span',(x.agent==='codex'?'🧩 Codex':'🤖 Claude')+' · '+x.projet+' · ');g.append(duree(x.debut));r.append(g,bouton('⏹',()=>{if(confirm('Arrêter '+x.agent+' sur '+x.projet+' ?'))envoyer('stop',{projet:x.projet})},'danger'));t.append(r)});app.append(t)}app.append(el('h2','📂 Projets'));const gr=el('div',undefined,'grille');etat.projets.slice(0,5).forEach(x=>gr.append(bouton((x.statut||'').split(' ')[0]+' '+x.nom,()=>fiche(x))));gr.append(bouton('Tous les projets ›',()=>projets(),'discret'));app.append(gr);const q=bouton('⚖️ '+quotasCourts()+'  ›',agents,'discret');q.style.cssText='width:100%;text-align:left;margin-top:12px;font-size:14px;color:var(--second)';app.append(q);if(afaire.length){const d=el('details');d.append(el('summary','📝 À faire de ton côté ('+(afaire.length)+')'));afaire.forEach(e=>{const r=el('div',undefined,'rangee');r.append(el('span',e.projet+' · '+court(e.texte,80)));d.append(r)});app.append(d)}const a=el('div',undefined,'ligne');a.style.marginTop='14px';a.append(bouton('🆕 Nouvelle tâche',()=>nouveau()),bouton('📥 Noter une idée',()=>idee()));app.append(a)}

const fils=new Map(),filsDemandes=new Map(),requetesFil=new Map();
function quotaMax(a){const q=etat.quotas?.[a]||{};if(q.bloque_jusqu_a*1000>Date.now())return 100;return Math.max(0,...['five_hour','seven_day'].map(k=>q[k]?.resets_at*1000>Date.now()?Number(q[k].pct)||0:0))}
function accueil(){if(!Array.isArray(etat.conversations))return accueilV2();vue='accueil';position={};titre('Conversations');const q=el('div',undefined,'meta');for(const a of ['claude','codex'])q.append(el('span',a[0].toUpperCase()+a.slice(1)+' '+quotaMax(a)+' %',quotaMax(a)>85?'quota-chaud':''));app.append(q);const convs=etat.conversations;for(const [statut,label]of [['atoi','🟠 À toi'],['travaille','🔵 Ça travaille'],['fini','✅ Fini']]){const items=convs.filter(c=>c.statut===statut);const bloc=statut==='fini'?el('details'):el('div');bloc.append(el(statut==='fini'?'summary':'h2',label+' ('+items.length+')'));items.slice(0,3).forEach(c=>{const b=bouton('',()=>conversation(c),'conversation-ligne');b.append(el('span',(c.agent==='codex'?'🧩 Codex':'🤖 Claude')+' · '+c.projet),el('p',court(c.recap||'En cours…',100)),el('small',depuis(c.recu)));bloc.append(b)});if(items.length>3)bloc.append(bouton('Voir les autres',()=>listeConversations(statut)));app.append(bloc)}if(!convs.some(c=>c.statut==='atoi'))app.append(el('p','Rien à faire pour toi 🎉','calme'));const autres=(etat.boite||[]).filter(e=>e.type!=='carte');if(autres.length){const d=el('details');d.append(el('summary','Questions et rappels ('+autres.length+')'));autres.slice(0,3).forEach(e=>d.append(e.type==='question'?attente(e):el('p',e.projet+' · '+court(e.texte,100))));app.append(d)}if((etat.conversations_total||0)>convs.length)app.append(el('p','Liste partielle. Les autres échanges restent dans le chat.','second'));app.append(bouton('➕ Nouvelle tâche',()=>nouveau(),'principal nouvelle-fixe'))}
function listeConversations(statut,page=0){vue='listeConversations';position={statut,page};titre('Conversations',accueil);pageListe((etat.conversations||[]).filter(c=>c.statut===statut),c=>app.append(bouton(c.projet+' · '+court(c.recap,80),()=>conversation(c),'conversation-ligne')),page,n=>listeConversations(statut,n))}
function conversation(c,charger=true){vue='conversation';position={conversation:c.id};titre(c.projet,accueil);const entete=el('div',undefined,'ligne');const autre=c.agent==='claude'?'Codex':'Claude';entete.append(bouton('🔁 Passer à '+autre,()=>preparerRelais(c)),bouton('⋯ Plus',()=>{titre(c.projet,()=>conversation(c,false));app.append(bouton('⏹ Arrêter',()=>{if(confirm('Arrêter les tâches de '+c.projet+' ?'))envoyer('stop',{projet:c.projet})}),bouton('📂 Projet',()=>{const p=etat.projets.find(p=>p.nom===c.projet);if(p)fiche(p);else envoyer('projet',{projet:c.projet})}),bouton('Actualiser le fil',()=>{filsDemandes.delete(c.id);conversation(c)}))}));app.append(entete);if(c.origine)app.append(bouton('← Conversation précédente',()=>{const o=etat.conversations.find(x=>x.id===c.origine);if(o)conversation(o);else statutEnvoi('Conversation précédente absente de cette liste.')}));const f=fils.get(c.id);const aJour=f&&f.carte===c.carte;const echanges=aJour?f.echanges:[{toi:c.demande||'',agent:c.recap||'Ça travaille…'}];for(const [i,x]of echanges.entries()){if(x.toi)app.append(el('div',x.toi,'bulle toi'));const b=el('div',undefined,'bulle agent');b.append(el('small',c.agent==='codex'?'🧩 Codex':'🤖 Claude'),el('p',x.agent));if(aJour&&i===echanges.length-1&&f.texte){const d=el('details');d.append(el('summary','Tout lire'),el('p',f.texte));if(f.tronque){d.append(el('small','Texte abrégé pour le direct.'),bouton('Texte complet dans le chat',()=>envoyer('tout_lire',{carte:c.carte})))}b.append(d)}app.append(b)}if(c.ask)app.append(el('p',c.ask,'question'));if(c.carte){const puces=el('div',undefined,'puces');(c.actions||[]).slice(0,3).forEach(t=>puces.append(bouton(court(t,50),ev=>{if(ev?.target)ev.target.disabled=true;envoyer('repondre',{carte:c.carte,texte:t})})));app.append(puces);const liens=el('details');liens.append(el('summary','Liens et images'));for(const [t,u]of c.liens||[])if(/^https:\/\//.test(u))liens.append(bouton('🔗 '+t,()=>{if(tg?.openLink)tg.openLink(u);else window.open?.(u,'_blank','noopener')}));if(c.images)liens.append(bouton('🖼 Voir les images dans la conversation',()=>envoyer('images',{carte:c.carte})));if((c.liens||[]).length||c.images)app.append(liens);const z=el('div',undefined,'repondre composeur'),t=el('textarea');t.dataset.carte=c.carte;t.rows=1;t.placeholder='Ta réponse…';t.maxLength=2000;t.setAttribute('aria-label','Ta réponse');const b=bouton('Envoyer',()=>{const texte=t.value.trim();if(!texte)return;t.disabled=true;b.disabled=true;b.textContent='Envoi…';envoyer('repondre',{carte:c.carte,texte})},'principal');z.append(t,b);app.append(z)}if(charger&&!aJour&&filsDemandes.get(c.id)!==c.carte){if(directPret){filsDemandes.set(c.id,c.carte);envoyer('fil',{conversation:c.id})}else app.append(el('p','Le fil complet attend la connexion au PC.','second'))}}
function preparerRelais(c){titre('Passer le relais',()=>conversation(c,false));app.append(el('p','Le nouvel agent reçoit l’état du projet et les derniers échanges.'));const a=choixAgent(app);a.value=c.agent==='claude'?'codex':'claude';app.append(bouton('Continuer',()=>envoyer('relais',{conversation:c.id,agent:a.value}),'principal'))}


function suggestion(consigne){const texte=consigne.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const mots={claude:['conception','architecture','plan','refacto','interface','ux','design','revue','review','doc','expli'],codex:['implement','test','bug','script','ci','longue','image','fix']};const score=a=>mots[a].filter(m=>new RegExp('\\b'+m+(['ci','ux'].includes(m)?'\\b':'')).test(texte)).length;const charges={claude:quotaMax('claude'),codex:quotaMax('codex')},scores={claude:score('claude'),codex:score('codex')};const dispos=['claude','codex'].filter(a=>charges[a]<95);if(!dispos.length){const dates=Object.values(etat.quotas||{}).flatMap(q=>[q.bloque_jusqu_a,q.five_hour?.resets_at,q.seven_day?.resets_at]).filter(t=>t*1000>Date.now());return {agent:null,raison:'Les deux agents sont proches de leur limite. '+(dates.length?'Recharge à '+new Date(Math.min(...dates)*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'.':'Recharge inconnue.')}}dispos.sort((a,b)=>Math.abs(scores.claude-scores.codex)<=1?charges[a]-charges[b]||scores[b]-scores[a]:scores[b]-scores[a]);let agent=dispos[0];const autre=agent==='claude'?'codex':'claude';if(charges[agent]>80&&charges[autre]<80)agent=autre;const oppose=agent==='claude'?'codex':'claude';return {agent,raison:agent[0].toUpperCase()+agent.slice(1)+' — '+charges[agent]+' % utilisé, contre '+charges[oppose]+' % pour '+oppose[0].toUpperCase()+oppose.slice(1)}}
function envoyer(action,d={}){if(['nouveau','reprendre','lancer_chantier','relais'].includes(action)&&d.agent==='auto'){let texte=d.texte||'';const p=etat.projets.find(p=>p.nom===d.projet);if(action==='reprendre')texte=p?.prochaine||'';if(action==='lancer_chantier')texte=p?.chantiers?.find(e=>e.id===d.element)?.texte||'';if(action==='relais')texte=etat.conversations?.find(c=>c.id===d.conversation)?.recap||'';const choix=suggestion(texte);vue='confirmationAuto';titre('Choisir l’agent',accueil);app.append(el('p',choix.raison));if(!choix.agent)return;const a=choixAgent(app);a.value=choix.agent;app.append(bouton('Lancer',()=>{if(a.value==='auto')return;transmettre(action,{...d,agent:a.value})},'principal'));return}return transmettre(action,d)}

function projets(page=0){vue='projets';position={page};titre('📂 Projets');pageListe(etat.projets,p=>app.append(bouton(court(p.nom)+' · '+p.statut,()=>fiche(p),'projet')),page,projets);if((etat.projets_total||0)>etat.projets.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('projets')))}
function encours(page=0){vue='encours';position={page};titre('🔵 En cours');pageListe(etat.taches,t=>{const s=el('section');s.append(el('p',court(t.agent+' · '+t.projet)),bouton('⏹ Stop',()=>{if(confirm('Arrêter les tâches ?'))envoyer('stop',{projet:t.projet})}));s.append(duree(t.debut));app.append(s)},page,encours);if((etat.taches_total||0)>etat.taches.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('etat')))}
function reception(page=0){position={page};vue='reception';titre('💬 À toi de répondre',accueil);const items=(etat.boite||[]).filter(e=>e.type!=='etat');if(!items.length)app.append(el('p','✅ Personne n’attend ta réponse','calme'));items.forEach(e=>app.append(attente(e)));if((etat.boite_total||0)>(etat.boite||[]).length)app.append(bouton('Voir la suite dans le chat',()=>envoyer('reception'),'discret'))}
function fiche(p){position={nom:p.nom};vue='projet';titre(p.nom,accueil);app.append(el('small',p.statut||''));const s=el('section');for(const [k,t]of[['ou','📍 '],['prochaine','➡️ '],['attente','⏳ Pour toi : ']])if(p[k]&&!/^«?\s*rien/i.test(p[k]))s.append(el('p',t+court(p[k],180)));if(s.children.length)app.append(s);const c=p.carte;if(c?.id&&(c.ask||c.actions?.length)){app.append(el('h2','💬 Dernier échange'));app.append(attente({type:'carte',id:c.id,agent:c.agent,projet:p.nom,recap:c.recap,texte:c.ask,actions:c.actions,images:c.images}))}else if(c?.id){app.append(el('h2','💬 Dernier échange'));const d=el('section');d.append(el('div',(c.agent==='codex'?'🧩 Codex':'🤖 Claude'),'meta'),el('p',c.recap||'','recap'));const z=el('div',undefined,'repondre');const t=el('textarea');t.dataset.carte=c.id;t.rows=1;t.placeholder='Continuer la conversation…';t.maxLength=2000;t.setAttribute('aria-label','Ta réponse');z.append(t,bouton('Envoyer',()=>{const v=t.value.trim();if(v)envoyer('repondre',{carte:c.id,texte:v})},'principal'));d.append(z);app.append(d)}const l=el('div',undefined,'ligne');l.style.marginTop='10px';l.append(bouton('▶️ Reprendre',()=>{titre('▶️ Reprendre '+p.nom,()=>fiche(p));app.append(el('p','L’agent relit l’état du projet et continue la prochaine étape.','second'));const a=choixAgent(app);app.append(bouton('Reprendre maintenant',()=>envoyer('reprendre',{projet:p.nom,agent:a.value}),'principal'))}),bouton('🆕 Nouvelle tâche',()=>nouveau(p.nom)));app.append(l);const m=el('div',undefined,'ligne');m.style.marginTop='8px';m.append(bouton('📥 Chantiers ('+(p.chantiers_total??p.chantiers?.length??0)+')',()=>historique(p,'chantiers'),'discret'),bouton('✅ Fait ('+(p.faits_total??p.faits?.length??0)+')',()=>historique(p,'faits'),'discret'),bouton('📋 Board',()=>envoyer('board',{projet:p.nom}),'discret'));app.append(m);const st=bouton('⏹ Arrêter les tâches du projet',()=>{if(confirm('Arrêter les tâches de '+p.nom+' ?'))envoyer('stop',{projet:p.nom})},'danger');st.style.cssText='width:100%;margin-top:14px';app.append(st)}
function reponse(p){vue='reponse';position={nom:p.nom};titre('💬 '+p.nom,()=>fiche(p));const c=p.carte;app.append(attente({type:'carte',id:c.id,agent:c.agent,projet:p.nom,recap:c.recap,texte:c.ask,actions:c.actions,images:c.images}))}
function idee(nom){vue='idee';titre('📥 Nouvelle idée');const projet=el('select');etat.projets.forEach(p=>{const o=el('option',p.nom);o.value=p.nom;o.selected=p.nom===nom;projet.append(o)});const texte=el('textarea');texte.maxLength=2000;texte.setAttribute('aria-label','Ton idée');app.append(projet,texte,bouton('📥 Ajouter aux chantiers',()=>{if(texte.value.trim()&&projet.value)envoyer('idee',{projet:projet.value,texte:texte.value.trim()})},'principal'));if((etat.projets_total||0)>etat.projets.length)app.append(bouton('Autre projet dans le chat',()=>envoyer('idees')))}
function historique(p,section,page=0){vue='historique';position={nom:p.nom,section,page};titre(section==='chantiers'?'📥 Chantiers':'✅ Fait');const items=p[section]||[];if(!items.length)app.append(el('p','Aucun élément dans cet état.'));pageListe(items,e=>{const s=el('section');s.append(el('p',court(e.texte)));if(section==='chantiers'){s.append(bouton('▶️ Lancer',()=>{titre('Choisis l’agent');const a=choixAgent(app);app.append(bouton('Lancer',()=>envoyer('lancer_chantier',{projet:p.nom,element:e.id,agent:a.value})))}),bouton('🗑 Retirer',()=>{if(confirm('Retirer ce chantier ?\n'+court(e.texte)))envoyer('retirer_confirmation',{projet:p.nom,element:e.id})},'danger'))}app.append(s)},page,n=>historique(p,section,n));if((p[section+'_total']||0)>items.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('historique',{projet:p.nom,section:section==='chantiers'?'Chantiers':'Fait récemment'})));if(section==='chantiers')app.append(bouton('📥 Nouvelle idée',()=>idee(p.nom)))}
function reglages(page=0){vue='reglages';position={page};titre('⚙️ Réglages');const noms={fins:'Fins de tour',son:'Son des cartes',detail:'Détail',claude:'Claude',codex:'Codex',calme:'Heures calmes',quotidien:'Résumé quotidien',heure_resume:'Heure du résumé',agent_defaut:'Agent par défaut'};const items=Object.entries(noms);pageListe(items,([k,t])=>app.append(bouton(t+' : '+String(etat.reglages?.[k]??'par défaut'),()=>envoyer('reglage',{cle:k}),'projet')),page,reglages);app.append(bouton('🔁 Nouvelle clé',()=>{if(confirm('Invalider les anciens liens ?'))envoyer('reglage',{cle:'nouvelle_cle'})}),bouton('🔕 Projets en sourdine',()=>sourdines()),bouton('🩺 Diagnostic',()=>envoyer('diagnostic')))}
function sourdines(page=0){vue='sourdines';position={page};titre('🔕 Projets en sourdine');pageListe(etat.projets,p=>app.append(bouton(((etat.reglages?.sourdines?.[p.nom]||0)*1000>Date.now()?'🔕 ':'🔔 ')+court(p.nom),()=>envoyer('reglage',{cle:'sourdine:'+p.nom}),'projet')),page,sourdines)}

async function decoder(valeur){const type=valeur[0],b64=valeur.slice(1).replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(type==='j')return JSON.parse(new TextDecoder().decode(bytes));if(type!=='z')throw Error('format');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(stream).text())}
// DIRECT_CRYPTO_DEBUT
function base64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function depuis64(s){if(typeof s!=='string'||!/^[A-Za-z0-9_-]*$/.test(s))throw Error('format');return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}
async function derives(secret){if(secret.length!==32)throw Error('clé');const key=await crypto.subtle.importKey('raw',secret,{name:'HMAC',hash:'SHA-256'},false,['sign']);const h=async s=>new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(s)));function sujet(bytes){const alphabet='abcdefghijklmnopqrstuvwxyz234567';let bits=0,v=0,out='';for(const b of bytes){v=(v<<8)|b;bits+=8;while(bits>=5){bits-=5;out+=alphabet[(v>>>bits)&31]}}if(bits)out+=alphabet[(v<<(5-bits))&31];return 'pont-'+out.slice(0,26)}return {k_etat:await h('etat-cle'),k_cmd:await h('cmd-cle'),topic_etat:sujet(await h('etat-sujet')),topic_cmd:sujet(await h('cmd-sujet'))}}
async function comprimer(bytes,decomp=false){const stream=new Blob([bytes]).stream().pipeThrough(decomp?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw'));const reader=stream.getReader(),morceaux=[];let total=0;try{while(true){const {value,done}=await reader.read();if(done)break;total+=value.length;if(total>65536)throw Error('taille');morceaux.push(value)}}finally{reader.cancel().catch(()=>{})}const out=new Uint8Array(total);let offset=0;for(const m of morceaux){out.set(m,offset);offset+=m.length}return out}
async function scellerJS(cle,valeur){const nonce=crypto.getRandomValues(new Uint8Array(12));const key=await crypto.subtle.importKey('raw',cle,'AES-GCM',false,['encrypt']);const brut=await comprimer(new TextEncoder().encode(JSON.stringify(valeur)));const chiffre=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce,tagLength:128},key,brut));const out=new Uint8Array(12+chiffre.length);out.set(nonce);out.set(chiffre,12);return 'v1.'+base64url(out)}
async function ouvrirJS(cle,message){if(typeof message!=='string'||message.length>4096||!message.startsWith('v1.'))throw Error('format');const brut=depuis64(message.slice(3));if(brut.length<28)throw Error('format');const key=await crypto.subtle.importKey('raw',cle,'AES-GCM',false,['decrypt']);const clair=await crypto.subtle.decrypt({name:'AES-GCM',iv:brut.slice(0,12),tagLength:128},key,brut.slice(12));return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(await comprimer(new Uint8Array(clair),true)))}
// DIRECT_CRYPTO_FIN
let directPret=false,clesDirect=null,sourceDirect=null,dernierDirect=0,seqDirect=-1,tsDirect=-1,reconnexion=false,demarrageDirect=Date.now(),position={};
const INTERVALLE_PRESENCE=30*60*1000;
let dernierSignal=0,pauseRelais=0,economieDirect=false;
function clePresence(){return "pont-presence-"+clesDirect.topic_cmd.slice(-8)}
function memoriserSignal(){dernierSignal=Date.now();try{localStorage.setItem(clePresence(),String(dernierSignal))}catch(e){}}
const enAttente=new Map();
function fraicheurTexte(maintenant=Date.now()/1000){const age=maintenant-(dernierDirect||etat.date||0);if(pauseRelais>Date.now())return '🟠 Limite du relais atteinte · utilise le chat Telegram';if(economieDirect)return '🟡 Économie de messages · actualise avec ↻';if(dernierDirect&&age<2100&&!reconnexion)return (age<150?'🟢 En direct · mis à jour ':'🟢 Relié · dernier état ')+(age<60?'il y a '+Math.max(0,Math.floor(age))+' s':'il y a '+Math.floor(age/60)+' min');if(directPret&&age<150||directPret&&!dernierDirect&&Date.now()-demarrageDirect<20000)return '🟡 Connexion au PC…';return '🔴 Hors ligne — infos de '+(etat.date?new Date(etat.date*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'date inconnue')}
function fraicheur(){const b=document.querySelector('#fraicheur');if(b)b.textContent=fraicheurTexte()}
function statutEnvoi(texte){const e=document.querySelector('#envoi');if(e)e.textContent=texte}
function rafraichirVue(){
 const champs=()=>Array.from(document.querySelectorAll?.('textarea[data-carte]')||[]);
 const brouillons=new Map(champs().map(e=>[e.dataset.carte,e.value]));
 const focus=document.activeElement?.dataset?.carte;
 const selection=[document.activeElement?.selectionStart,document.activeElement?.selectionEnd];
 const projet=etat.projets.find(p=>p.nom===position.nom);
 if(vue==='accueil')accueil();
 else if(vue==='conversation'){const c=etat.conversations?.find(c=>c.id===position.conversation);if(c)conversation(c);else accueil()}
 else if(vue==='listeConversations')listeConversations(position.statut,position.page||0);
 else if(vue==='reception')reception(position.page||0);
 else if(vue==='agents')agents();
 else if(vue==='projets')projets(position.page||0);
 else if(vue==='encours')encours(position.page||0);
 else if(vue==='reglages')reglages(position.page||0);
 else if(vue==='projet'&&projet)fiche(projet);
 else if(vue==='reponse'&&projet?.carte?.id)reponse(projet);
 else if(vue==='historique'&&projet)historique(projet,position.section,position.page||0);
 else if(vue==='sourdines')sourdines(position.page||0);
 for(const e of champs()){if(brouillons.has(e.dataset.carte))e.value=brouillons.get(e.dataset.carte);if(e.dataset.carte===focus){e.focus();e.setSelectionRange(...selection)}}
}
async function appliquerDirect(message){try{
 const d=await ouvrirJS(clesDirect.k_etat,message);
 if(d.t==='fil'){if(!requetesFil.has(d.requete)||requetesFil.get(d.requete)!==d.conversation||!Array.isArray(d.echanges)||typeof d.texte!=='string')return;requetesFil.delete(d.requete);fils.set(d.conversation,d);filsDemandes.delete(d.conversation);if(enAttente.has(d.requete)){clearTimeout(enAttente.get(d.requete));enAttente.delete(d.requete)}statutEnvoi('✅ Fil reçu');if(vue==='conversation'&&position.conversation===d.conversation)rafraichirVue();return;}
 if(d.t!=='etat'||!Number.isSafeInteger(d.seq)||!Number.isFinite(d.ts)||!d.etat||!Array.isArray(d.etat.projets)||!Array.isArray(d.etat.boite)||!Array.isArray(d.etat.taches)||!Array.isArray(d.acks))return;
 if(d.seq<=seqDirect||d.ts<tsDirect)return;
 for(const id of d.acks){if(enAttente.has(id)){clearTimeout(enAttente.get(id));enAttente.delete(id);statutEnvoi('✅ Reçu par le PC')}}
 const ancien=JSON.stringify({...etat,date:0}),suivant=JSON.stringify({...d.etat,date:0});
 economieDirect=!!d.economie&&new Date(d.ts*1000).toISOString().slice(0,10)===new Date().toISOString().slice(0,10);seqDirect=d.seq;tsDirect=d.ts;dernierDirect=d.ts;reconnexion=false;etat=d.etat;fraicheur();
 if(ancien!==suivant)rafraichirVue();
 }catch(e){/* Ignorer le contenu du relais sans le journaliser. */}}
async function envoyerDirect(cmd,silencieux=false){
 if(pauseRelais>Date.now()){if(!silencieux)statutEnvoi('⚠️ Limite du relais : rien envoyé. Continue dans le chat Telegram.');if(cmd.a==='fil')filsDemandes.delete(cmd.conversation);else rafraichirVue();return;}
 const id=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');
 if(cmd.a==='fil')requetesFil.set(id,cmd.conversation);
 if(!silencieux){statutEnvoi('⏳ Envoi…');enAttente.set(id,setTimeout(()=>{enAttente.delete(id);statutEnvoi('⚠️ Pas de réponse du PC')},20000))}
 try{
  const corps=await scellerJS(clesDirect.k_cmd,{t:'cmd',id,ts:Date.now()/1000,cmd});if(corps.length>4096)throw Error('taille');
  const reponse=await fetch('https://ntfy.sh/'+clesDirect.topic_cmd,{method:'POST',headers:{'Content-Type':'text/plain','Cache':'yes'},body:corps,referrerPolicy:'no-referrer'});
  if(reponse.status===429){
   // Refus explicite : aucune action n'a été acceptée, aucun renvoi automatique.
   pauseRelais=Date.now()+3600000;
   try{const erreur=JSON.parse(await reponse.text());if(erreur.code!==42908)pauseRelais=Date.now()+60000}catch(e){}
   if(enAttente.has(id)){clearTimeout(enAttente.get(id));enAttente.delete(id)}
   requetesFil.delete(id);if(cmd.a==='fil')filsDemandes.delete(cmd.conversation);
   statutEnvoi('⚠️ Limite du relais : rien envoyé. Continue dans le chat Telegram.');fraicheur();rafraichirVue();return;
  }
  if(!reponse.ok)throw Error('relais');
  memoriserSignal();
 }catch(e){/* Attendre l'accusé sans risquer un double envoi Telegram. */}
}
async function demarrerDirect(secret){if(!secret||!globalThis.crypto?.subtle)return;try{
 clesDirect=await derives(depuis64(secret));directPret=true;
 try{const signal=Number(localStorage.getItem(clePresence()));if(Number.isFinite(signal)&&signal<=Date.now())dernierSignal=signal}catch(e){}
 fraicheur();const url='https://ntfy.sh/'+clesDirect.topic_etat;
 // Les lectures ne publient rien. Inclure le dernier état même si un fil a été envoyé ensuite.
 fetch(url+'/json?poll=1&since=35m',{referrerPolicy:'no-referrer'}).then(async r=>{if(!r.ok)return;const texte=await r.text();if(texte.length>262144)return;for(const ligne of texte.split('\n')){try{const e=JSON.parse(ligne);if(e.event==='message')await appliquerDirect(e.message)}catch(e){}}}).catch(()=>{});
 sourceDirect=new EventSource(url+'/sse');sourceDirect.addEventListener('message',e=>{try{const d=JSON.parse(e.data);if(d.event==='message')appliquerDirect(d.message)}catch(e){}});
 sourceDirect.onerror=()=>{reconnexion=true;fraicheur()};sourceDirect.onopen=()=>{reconnexion=false;fraicheur()};
 pingDirect();setInterval(()=>{if(document.visibilityState!=='hidden')pingDirect()},60000);
 document.addEventListener?.('visibilitychange',()=>{if(document.visibilityState==='visible')pingDirect()})
 }catch(e){directPret=false;fraicheur()}}
function pingDirect(){if(economieDirect&&new Date(tsDirect*1000).toISOString().slice(0,10)!==new Date().toISOString().slice(0,10))economieDirect=false;if(directPret&&!economieDirect&&pauseRelais<=Date.now()&&(!dernierSignal||Date.now()-dernierSignal>=INTERVALLE_PRESENCE)){memoriserSignal();return envoyerDirect({v:1,a:'ping'},true)}}

if(typeof setInterval==='function')setInterval(()=>{fraicheur();for(const e of document.querySelectorAll?.('[data-debut]')||[])e.textContent=Math.max(0,Math.floor(Date.now()/1000-Number(e.dataset.debut)))+' s'},1000);
(async()=>{try{tg?.ready();tg?.expand();const t=tg?.themeParams||{};for(const[k,v]of Object.entries({'--fond':t.bg_color,'--carte':t.secondary_bg_color,'--texte':t.text_color,'--second':t.hint_color,'--accent':t.button_color}))if(v)document.documentElement.style.setProperty(k,v);const params=new URLSearchParams(location.hash.slice(1));if(params.get('d')){try{etat=await decoder(params.get('d'))}catch(e){if(!params.get('j'))throw e;etat=await decoder(params.get('j'))}}document.querySelector('#nav').append(bouton('🏠 Accueil',accueil),bouton('📂 Projets',()=>projets()),bouton('⚖️ Quotas',agents),bouton('⚙️ Réglages',reglages));accueil();fraicheur();demarrerDirect(params.get('k'))}catch(e){app.replaceChildren(el('h1','État indisponible'),el('p','Reviens au bot et appuie sur Accueil, puis ouvre l’appli à nouveau.'))}})();
</script></body></html>
