<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>Pont — mes projets</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--fond:#101827;--carte:#1e293b;--texte:#eef4ff;--second:#b5c5d9;--accent:#6dc8ff}*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:17px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:27px;margin:10px 0}h2{font-size:21px}p{line-height:1.55;white-space:pre-wrap}small,.second{color:var(--second)}section,.projet{background:var(--carte);border:1px solid #8192a333;border-radius:18px;padding:18px;margin:14px 0}.projet{display:block;text-align:left;width:100%;color:var(--texte)}button,select,textarea{font:inherit;border-radius:12px;border:1px solid #8192a355;padding:13px;min-height:48px}button{background:var(--carte);color:var(--texte);cursor:pointer}button.principal{background:var(--accent);color:#081526;font-weight:650}button:hover{filter:brightness(1.12)}.ligne{display:flex;gap:8px;flex-wrap:wrap}.ligne>*{flex:1}textarea,select{display:block;width:100%;background:var(--fond);color:var(--texte);margin:10px 0}textarea{min-height:115px;resize:vertical}progress{display:block;width:100%;height:16px;accent-color:var(--accent);margin:7px 0 16px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--fond);border-top:1px solid #8192a333;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center}nav button{font-size:14px;padding:10px 12px}.badge{font-size:14px;color:var(--second)}label{display:block;margin-top:18px}.danger{color:#ffaca9}.vide{padding:35px 10px;text-align:center}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent)}
main{width:100%;min-width:0}button{max-width:100%;overflow-wrap:anywhere}nav button{min-width:0;flex:1;font-size:13px;padding:10px 6px}header h1{overflow-wrap:anywhere}
</style></head><body><main id="app" aria-live="polite"><p>Chargement de tes projets…</p></main><nav id="nav" aria-label="Navigation"></nav>
<script>
'use strict';
const tg=window.Telegram?.WebApp;let etat={projets:[],quotas:{},taches:[],reglages:{}},vue='accueil';
const app=document.querySelector('#app');
function el(tag,texte,classe){const e=document.createElement(tag);if(texte!==undefined)e.textContent=String(texte);if(classe)e.className=classe;return e}
function bouton(texte,action,classe){const b=el('button',texte,classe);b.type='button';b.onclick=action;return b}
function envoyer(a,champs={}){const data=JSON.stringify({v:1,a,...champs});if(new TextEncoder().encode(data).length>4096){alert('Ta consigne est trop longue. Raccourcis-la.');return}if(typeof tg?.sendData!=='function'){alert('Ouvre cette appli depuis le bouton du bot Telegram.');return}tg.sendData(data);tg.close()}
function titre(texte){app.replaceChildren();const h=el('header');h.append(el('h1',texte),bouton('↻',()=>envoyer('actualiser')));app.append(h,el('small',etat.date?'État de '+new Date(etat.date*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'État indisponible'))}
function jauges(parent,agent,q){const box=el('section');box.append(el('h2',(agent==='claude'?'🤖 Claude':'🧩 Codex')));for(const [k,label] of [['five_hour','Session 5 h'],['seven_day','Semaine']]){const f=q?.[k];let pct=f?(f.resets_at*1000<Date.now()?0:f.pct):null;box.append(el('div',label+' · '+(pct===null?'inconnue':pct+' %')));const p=el('progress');p.max=100;p.value=pct||0;box.append(p);if(f)box.append(el('small',f.resets_at*1000<Date.now()?'Remis à zéro':'Renouvellement : '+new Date(f.resets_at*1000).toLocaleString('fr-FR')))}if(q?.bloque_jusqu_a*1000>Date.now())box.append(el('p','⛔ Bloqué jusqu’à '+new Date(q.bloque_jusqu_a*1000).toLocaleTimeString('fr-FR'),'danger'));parent.append(box)}
function choixAgent(parent){const label=el('label','Avec quel agent ?');const select=el('select');for(const [v,t]of[['claude','🤖 Claude'],['codex','🧩 Codex'],['auto','✨ Auto — demander une suggestion']]){const o=el('option',t);o.value=v;select.append(o)}label.append(select);parent.append(label);return select}
function nouveau(nom){vue='nouveau';titre('🆕 Nouvelle tâche');const label=el('label','Projet');const projet=el('select');etat.projets.forEach(p=>{const o=el('option',p.nom);o.value=p.nom;o.selected=p.nom===nom;projet.append(o)});label.append(projet);app.append(label);const agent=choixAgent(app),texte=el('textarea');texte.placeholder='Ce que tu veux faire…';texte.maxLength=2000;texte.setAttribute('aria-label','Ta consigne');app.append(texte,bouton('Envoyer la consigne',()=>{if(texte.value.trim()&&projet.value)envoyer('nouveau',{projet:projet.value,agent:agent.value,texte:texte.value.trim()})},'principal'));app.append(el('p','Auto propose un agent dans le chat. Tu confirmes avant qu’il travaille.','second'))}
function agents(){vue='agents';titre('⚖️ Agents');for(const a of ['claude','codex'])jauges(app,a,etat.quotas[a]);app.append(bouton('🔄 Actualiser',()=>envoyer('actualiser'),'principal'))}
function court(s,n=60){s=String(s||'').replace(/\s+/g,' ').replace(/^[- ]+/,'');return s.length>n?s.slice(0,n-1)+'…':s}
function pageListe(items,rendu,page=0,suite){items.slice(page*3,page*3+3).forEach(rendu);if(page)app.append(bouton('◀️ Retour',()=>suite(page-1)));if(items.length>(page+1)*3)app.append(bouton('Voir plus',()=>suite(page+1)))}
function quotasCourts(){return ['claude','codex'].map(a=>{const f=etat.quotas[a]?.five_hour;return (a==='claude'?'Claude ':'Codex ')+(f?(f.resets_at*1000<Date.now()?0:f.pct)+' %':'inconnu')}).join(' · ')}
function accueil(){vue='accueil';titre('🏠 Bonjour');const b=el('section');b.append(el('h2','🟠 '+(etat.boite_total??etat.boite?.length??0)+((etat.boite_total??etat.boite?.length??0)===1?' chose t’attend':' choses t’attendent')),bouton('Voir',()=>reception()));app.append(b);const t=el('section');t.append(el('h2','🔵 '+(etat.taches_total??etat.taches.length)+((etat.taches_total??etat.taches.length)===1?' tâche en cours':' tâches en cours')),bouton('Voir',()=>encours()));app.append(t);const p=el('section');p.append(el('h2','📂 Projets récents'));etat.projets.slice(0,3).forEach(x=>p.append(bouton(court(x.nom),()=>fiche(x),'projet')));p.append(bouton('Tous',()=>projets()));app.append(p);const q=el('section');q.append(el('p','⚖️ '+quotasCourts()),bouton('Détail',agents));app.append(q);const actions=el('div',undefined,'ligne');actions.append(bouton('📥 Nouvelle idée',()=>idee()),bouton('🆕 Nouvelle tâche',()=>nouveau()),bouton('⚙️ Réglages',()=>reglages()));app.append(actions)}
function projets(page=0){titre('📂 Projets');pageListe(etat.projets,p=>app.append(bouton(court(p.nom)+' · '+p.statut,()=>fiche(p),'projet')),page,projets);if((etat.projets_total||0)>etat.projets.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('projets')))}
function encours(page=0){titre('🔵 En cours');pageListe(etat.taches,t=>{const s=el('section');s.append(el('p',court(t.agent+' · '+t.projet)),bouton('⏹ Stop',()=>{if(confirm('Arrêter les tâches ?'))envoyer('stop',{projet:t.projet})}));app.append(s)},page,encours);if((etat.taches_total||0)>etat.taches.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('etat')))}
function reception(page=0){titre('🟠 Ce qui t’attend');const items=etat.boite||[];if(!items.length)app.append(el('p','Rien dans cet état.'));pageListe(items,e=>{const s=el('section');s.append(el('p',court(e.projet+' · '+e.texte)));if(e.type==='question'){(e.options||[]).slice(0,3).forEach((o,i)=>s.append(bouton(court(o),()=>envoyer('decision',{question:e.id,option:i}))));const texte=el('textarea');texte.maxLength=2000;texte.setAttribute('aria-label','Ta réponse');s.append(texte,bouton('✍️ Répondre',()=>{if(texte.value.trim())envoyer('decision_texte',{question:e.id,texte:texte.value.trim()})}))}else{const p=etat.projets.find(p=>p.nom===e.projet);s.append(bouton(e.type==='carte'?'✍️ Répondre':'📂 Projet',()=>e.type==='carte'?envoyer('reponse_prompt',{carte:e.id}):p?fiche(p):envoyer('projet',{projet:e.projet})))}app.append(s)},page,reception);if((etat.boite_total||0)>items.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('reception')))}
function fiche(p){vue='projet';titre('📂 '+court(p.nom,40));app.append(el('p',p.statut,'badge'));const s=el('section');for(const [k,t]of[['ou','📍 '],['prochaine','➡️ '],['attente','⏳ ']])s.append(el('p',t+court(p[k]||'rien',56)));app.append(s);const c=p.carte;if(c?.id){app.append(bouton('↩️ Dernière réponse',()=>reponse(p)),bouton('✍️ Répondre',()=>reponse(p)))}app.append(bouton('📥 Chantiers ('+(p.chantiers_total??p.chantiers?.length??0)+')',()=>historique(p,'chantiers')),bouton('✅ Fait ('+(p.faits_total??p.faits?.length??0)+')',()=>historique(p,'faits')),bouton('📋 Board',()=>envoyer('board',{projet:p.nom})));const agent=choixAgent(app);app.append(bouton('▶️ Reprendre',()=>{if(confirm('Reprendre ce projet ?'))envoyer('reprendre',{projet:p.nom,agent:agent.value})}),bouton('🆕 Nouvelle conversation',()=>nouveau(p.nom)),bouton('⏹ Stop',()=>{if(confirm('Arrêter les tâches ?'))envoyer('stop',{projet:p.nom})}))}
function reponse(p){titre('💬 Dernière réponse');const c=p.carte;app.append(el('p',court(c.recap)),el('strong',court(c.ask)));(c.actions||[]).slice(0,3).forEach(a=>app.append(bouton(court(a),()=>envoyer('repondre',{carte:c.id,texte:a}))));if((c.actions||[]).length>3)app.append(bouton('Voir plus',()=>envoyer('actions_carte',{carte:c.id})));app.append(bouton('📄 Tout lire dans le chat',()=>envoyer('tout_lire',{carte:c.id})));if(c.images)app.append(bouton('🖼 Voir les images',()=>envoyer('images',{carte:c.id})));const texte=el('textarea');texte.maxLength=2000;texte.setAttribute('aria-label','Ta réponse');app.append(texte,bouton('✍️ Répondre',()=>{if(texte.value.trim())envoyer('repondre',{carte:c.id,texte:texte.value.trim()})}),bouton('▶️ Continue',()=>envoyer('continuer',{carte:c.id})))}
function idee(nom){titre('📥 Nouvelle idée');const projet=el('select');etat.projets.forEach(p=>{const o=el('option',p.nom);o.value=p.nom;o.selected=p.nom===nom;projet.append(o)});const texte=el('textarea');texte.maxLength=2000;texte.setAttribute('aria-label','Ton idée');app.append(projet,texte,bouton('📥 Ajouter aux chantiers',()=>{if(texte.value.trim()&&projet.value)envoyer('idee',{projet:projet.value,texte:texte.value.trim()})},'principal'));if((etat.projets_total||0)>etat.projets.length)app.append(bouton('Autre projet dans le chat',()=>envoyer('idees')))}
function historique(p,section,page=0){titre(section==='chantiers'?'📥 Chantiers':'✅ Fait');const items=p[section]||[];if(!items.length)app.append(el('p','Aucun élément dans cet état.'));pageListe(items,e=>{const s=el('section');s.append(el('p',court(e.texte)));if(section==='chantiers'){s.append(bouton('▶️ Lancer',()=>{titre('Choisis l’agent');const a=choixAgent(app);app.append(bouton('Lancer',()=>envoyer('lancer_chantier',{projet:p.nom,element:e.id,agent:a.value})))}),bouton('🗑 Retirer',()=>{if(confirm('Retirer ce chantier ?\n'+court(e.texte)))envoyer('retirer_confirmation',{projet:p.nom,element:e.id})},'danger'))}app.append(s)},page,n=>historique(p,section,n));if((p[section+'_total']||0)>items.length)app.append(bouton('Voir plus dans le chat',()=>envoyer('historique',{projet:p.nom,section:section==='chantiers'?'Chantiers':'Fait récemment'})));if(section==='chantiers')app.append(bouton('📥 Nouvelle idée',()=>idee(p.nom)))}
function reglages(page=0){vue='reglages';titre('⚙️ Réglages');const noms={fins:'Fins de tour',son:'Son des cartes',detail:'Détail',claude:'Claude',codex:'Codex',calme:'Heures calmes',quotidien:'Résumé quotidien',heure_resume:'Heure du résumé'};const items=Object.entries(noms);pageListe(items,([k,t])=>app.append(bouton(t+' : '+String(etat.reglages?.[k]??'par défaut'),()=>envoyer('reglage',{cle:k}),'projet')),page,reglages);app.append(bouton('🔕 Projets en sourdine',()=>sourdines()),bouton('🩺 Diagnostic',()=>envoyer('diagnostic')))}
function sourdines(page=0){titre('🔕 Projets en sourdine');pageListe(etat.projets,p=>app.append(bouton(((etat.reglages?.sourdines?.[p.nom]||0)*1000>Date.now()?'🔕 ':'🔔 ')+court(p.nom),()=>envoyer('reglage',{cle:'sourdine:'+p.nom}),'projet')),page,sourdines)}

async function decoder(valeur){const type=valeur[0],b64=valeur.slice(1).replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(type==='j')return JSON.parse(new TextDecoder().decode(bytes));if(type!=='z')throw Error('format');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(stream).text())}
(async()=>{try{tg?.ready();tg?.expand();const t=tg?.themeParams||{};for(const[k,v]of Object.entries({'--fond':t.bg_color,'--carte':t.secondary_bg_color,'--texte':t.text_color,'--second':t.hint_color,'--accent':t.button_color}))if(v)document.documentElement.style.setProperty(k,v);const params=new URLSearchParams(location.hash.slice(1));if(params.get('d')){try{etat=await decoder(params.get('d'))}catch(e){if(!params.get('j'))throw e;etat=await decoder(params.get('j'))}}document.querySelector('#nav').append(bouton('🏠 Accueil',accueil),bouton('🆕 Tâche',()=>nouveau()),bouton('⚖️ Agents',agents),bouton('⚙️ Réglages',reglages));accueil()}catch(e){app.replaceChildren(el('h1','État indisponible'),el('p','Reviens au bot et appuie sur Accueil, puis ouvre l’appli à nouveau.'))}})();
</script></body></html>
